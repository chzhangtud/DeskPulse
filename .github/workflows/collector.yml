name: Collector checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Display logic
        run: node --test tests/core.test.cjs tests/i18n.test.cjs tests/stocks.test.cjs
      - name: Collector fixture tests
        run: dotnet run --project tests/Collector.Tests -c Release
      - name: Build collector
        run: dotnet build collector -c Release
      - name: Authenticated collector integration
        run: python tests/collector_integration.py
      - name: Build and verify Linux archive
        if: runner.os == 'Linux'
        env:
          DESKPULSE_RUNTIME_VERSION: '8.0.32'
        run: |
          bash scripts/linux/build.sh
          python tests/linux_package_test.py artifacts/DeskPulse-0.2.0-linux-x64.tar.gz
      - name: Linux helper tests
        if: runner.os == 'Linux'
        run: python tests/linux_helpers_test.py
